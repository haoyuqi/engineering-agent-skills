schema_version: 1
language: auto
provider: auto # auto | github | gitlab
git:
  remote: origin
  allow_force_push: false
  run_hooks: true
commit:
  convention: auto # auto | conventional | freeform
  issue_key_pattern: "[A-Z][A-Z0-9]+-[0-9]+"
  suffix: null
change_request:
  draft_by_default: true
  target_branch: auto
  labels: []
  reviewers: []
  assignees: []
safety:
  # Host guidance only; these values do not authorize writes.
  authorization_mode: explicit_scope
  repeat_confirmation_for_unchanged_scope: false
  honor_step_by_step_requests: true
  confirm_scope_or_target_changes: true
  require_specific_high_risk_approval: true
  preserve_unrelated_staged_changes: true
