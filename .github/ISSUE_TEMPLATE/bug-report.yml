name: Bug report
description: Report a reproducible problem in an existing Skill or its bundled scripts.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the project. Remove credentials, internal URLs, and private code before submitting.
  - type: input
    id: skill
    attributes:
      label: Skill
      description: Which Skill is affected?
      placeholder: repository-vulnerabilities
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and safe reproduction steps
      description: Include sanitized output, Agent/runtime, and operating system when relevant.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, tokens, internal URLs, and personally identifying information.
          required: true
