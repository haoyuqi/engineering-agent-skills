name: Bug report
description: Report a reproducible problem in a Skill or its bundled scripts.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: >-
        Remove secrets, tokens, private URLs, and personal information. Attach only sanitized logs or screenshots.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which Skill is affected, and what happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest safe, repeatable set of steps and inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Add sanitized logs or screenshots here if useful.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions and environment
      description: >-
        Include the exact Skill revision and Agent/runtime versions, plus the operating system when relevant.
        Include the model only when the behavior depends on model output. Use installed versions or commit IDs without a leading v.
    validations:
      required: true
