name: Skill proposal
description: Propose an independently installable engineering Skill.
title: "skill: "
labels: [skill-proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended users
      description: Describe the repeatable engineering problem, without company-specific context.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Proposed workflow and safety boundary
      description: Explain inputs, evidence, tool orchestration, and which actions need confirmation.
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: Evaluation idea
      description: Suggest fictional fixtures and observable success or failure cases.
    validations:
      required: true
  - type: checkboxes
    id: independence
    attributes:
      label: Independence and privacy check
      options:
        - label: The proposal can be useful independently and does not require internal systems, data, or credentials.
          required: true
